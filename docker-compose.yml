# Runs the whole backend - Ollama (the local AI engine) plus the Grandma
# AI server - as one command, replacing the old "npm run ollama:setup"
# local script. Requires server/.env to exist first (cp server/.env.example
# server/.env); everything in it loads into the server container, except
# AI_PROVIDER/OLLAMA_BASE_URL below, which are pinned to talk to the
# `ollama` service over the Docker network rather than localhost.
#
# Usage:
#   cp server/.env.example server/.env   # fill in real secrets as needed
#   docker compose up --build
#
# First run downloads the two Ollama models (a few GB) via the one-shot
# `ollama-pull` service, then the server starts once they're ready.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.1 && ollama pull llava && echo 'Models ready.'"
    restart: "no"

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: file:/data/dev.db
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - server_data:/data
      - server_uploads:/app/uploads
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data:
  server_data:
  server_uploads:
